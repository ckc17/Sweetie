<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yesterday </title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Quicksand:wght@300;400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- BACKGROUND -->

<div id="stars"></div>

<div id="moon"></div>

<div id="sparkles"></div>


<!-- INTRO -->

<section id="intro">

<div class="introContent">

<h1>

Some Days Become Memories...

</h1>

<p>

Yesterday became my favourite one.

</p>

<button id="startBtn">

Begin Our Day 

</button>

</div>

</section>


<!-- ENVELOPE -->

<section id="envelopeScene">

<div class="desk">

<div class="envelope">

<div class="back"></div>

<div class="front"></div>

<div class="flap"></div>

<div class="seal">

❤️

</div>

<div class="letter">

<h1>

To My Favourite Person ❤️

</h1>

<div id="letterText">

</div>

</div>

</div>

</div>

</section>
<!-- ================= PHOTO SCENE ================= -->

<section id="photoScene">

    <div id="photoStack">

        <img src="photo1.jpg" class="memory memory1" alt="Memory 1">

        <img src="photo2.jpg" class="memory memory2" alt="Memory 2">

        <img src="photo3.jpg" class="memory memory3" alt="Memory 3">

        <img src="photo4.jpg" class="memory memory4" alt="Memory 4">

    </div>

</section>


<!-- ================= MUSIC ================= -->

<audio id="bgMusic" loop>

    <source src="song1.mp3" type="audio/mpeg">

</audio>


<script src="script.js"></script>

</body>

</html>
